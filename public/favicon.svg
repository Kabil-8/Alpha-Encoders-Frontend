<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ae-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="60%" stop-color="#2563FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="ae-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge Glow Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0A1024" stroke="rgba(37, 99, 255, 0.35)" stroke-width="1.5" />
  
  <!-- Left Code Angle / Alpha loop -->
  <path d="M15 16L9 24L15 32" stroke="url(#ae-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Alpha Core Geometry: Modern stylized Alpha loop seamlessly connecting to Right Code Angle -->
  <path d="M33 16C31 16 28 18 25 22C21 27.5 17 32 13 32" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M19 16C23 21 28 28 35 32" stroke="url(#ae-grad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="28" cy="22" r="3.5" stroke="#22D3EE" stroke-width="2.2" fill="#050816" filter="url(#ae-glow)" />

  <!-- Right Code Angle Bracket -->
  <path d="M33 16L39 24L33 32" stroke="url(#ae-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>